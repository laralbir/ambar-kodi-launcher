name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: Ambar-macos
          - os: windows-latest
            asset_name: Ambar-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir ejecutable
        run: python build.py

      # zip no esta disponible por defecto en los runners de windows-latest
      # (solo en linux/macos) -- Compress-Archive es el equivalente nativo.
      - name: Empaquetar dist/ en zip (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(cat VERSION)
          cd dist
          zip -r "../${{ matrix.asset_name }}-${version}.zip" .

      - name: Empaquetar dist/ en zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw
          $version = $version.Trim()
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.asset_name }}-$version.zip"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: "${{ matrix.asset_name }}-*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          # Tags con un identificador de pre-release semver (v1.2.3-beta.1)
          # se publican como "Pre-release" en GitHub, no como "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
